name: Deploy Clip Studio with FFmpeg (v0.4.6)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create deploy directory and install pinned FFmpeg files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/vendor/ffmpeg
          cp index.html app.js style.css pursuit-level-logo.png publish/
          cd publish
          npm pack @ffmpeg/ffmpeg@0.12.10 --pack-destination /tmp --silent
          npm pack @ffmpeg/core@0.12.10 --pack-destination /tmp --silent
          mkdir -p /tmp/clip-ffmpeg /tmp/clip-core
          tar -xzf /tmp/ffmpeg-ffmpeg-0.12.10.tgz -C /tmp/clip-ffmpeg
          tar -xzf /tmp/ffmpeg-core-0.12.10.tgz -C /tmp/clip-core
          cp /tmp/clip-ffmpeg/package/dist/umd/ffmpeg.js vendor/ffmpeg/
          cp /tmp/clip-ffmpeg/package/dist/umd/814.ffmpeg.js vendor/ffmpeg/
          cp /tmp/clip-core/package/dist/esm/ffmpeg-core.js vendor/ffmpeg/
          cp /tmp/clip-core/package/dist/esm/ffmpeg-core.wasm vendor/ffmpeg/
          touch .nojekyll
          for file in ffmpeg.js 814.ffmpeg.js ffmpeg-core.js ffmpeg-core.wasm; do
            test -s "vendor/ffmpeg/$file" || { echo "MISSING: $file"; exit 1; }
          done
          test "$(stat -c%s vendor/ffmpeg/ffmpeg-core.wasm)" -gt 30000000
          # Fail deployment if the core is not an ES module.
          grep -Eq 'export[[:space:]]*(default|\{)' vendor/ffmpeg/ffmpeg-core.js || { echo 'CORE IS NOT ESM'; exit 1; }
          grep -q 'v0.4.6 / LOCAL WORKSPACE' index.html
          echo "Confirmed v0.4.6 app and all four engine files in deployment artifact:"
          ls -lh vendor/ffmpeg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
